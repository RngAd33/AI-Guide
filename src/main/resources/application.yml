server:
  port: 8081
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

ai:
  model-type: ${sky.ai.model-type}

# 联网搜索（jina）
search:
  api-key: ${sky.search.api-key}

spring:
  # 指定环境
  profiles:
    active: dev
  # 应用重命名
  application:
    name: Ai-Guide
  # 数据库配置
  datasource:
    url: ${sky.datasource.url}
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
  # Redis配置
  data:
    redis:
      database: ${sky.redis.database}
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      timeout: ${sky.redis.timeout}
  # 超时时间
  session:
    secret-key: ${sky.jwt.secret-key}
    timeout: ${sky.jwt.admin-ttl}
    token-name: ${sky.jwt.admin-token-name}
  # SpringAI
  ai:
    # 阿里灵积
    dashscope:
      api-key: ${sky.ai.dashscope.api-key}
      chat:
        options:
          model: ${sky.ai.dashscope.chat.options.model}
    # 本地模型
    ollama:
      base-url: ${sky.ai.ollama.base-url}
      chat:
        model: ${sky.ai.ollama.chat.model}
#    # 向量数据库
#    vectorstore:
#      mariadb:
#        index-type: HNSW
#        initialize-schema: true
#        dimensions: 1536
#        max-document-batch-size: 10000

    # MCP
#    mcp:
#      client:
#        timeout: 600s
#          # read: 600s
#          # write: 600s
#        connection-timeout: 600s
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8083
        # stdio:
          # server-configuration: classpath:mcp-servers.json


mybatis-flex:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 显示数据库日志
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名自动映射
    map-underscore-to-camel-case: true
  global-config:
    logic-delete-column: isDelete
    logic-delete-value: 1
    logic-not-delete-value: 0

# 接口文档
knife4j:
  enable: true
  setting:
    language: zh-CN
  openapi:
    title: AI智能体接口文档
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.rngad33.aiguide.controller
